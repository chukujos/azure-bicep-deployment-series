# Step 1: Create and navigate to the directory for the runner
mkdir actions-runner && cd actions-runner

# Step 2: Download the runner package (example version 2.319.1)
curl -o actions-runner-linux-x64-2.319.1.tar.gz -L -H 'Authorization: Bearer <YOUR_ACCESS_TOKEN>' \
https://github.adnet.internal/_services/pipelines/_apis/distributedtask/packagedownload/agent/linux-x64/2.319.1

# Step 3: Verify the file integrity
echo "3f6efb7488a183e291fc2c62876e14c9ee732864173734facc85a1bfb1744464  actions-runner-linux-x64-2.319.1.tar.gz" | shasum -a 256 -c

# Step 4: Extract the runner package
tar xzf ./actions-runner-linux-x64-2.319.1.tar.gz

# Step 5: Configure the runner with your repository or organization
./config.sh --url https://github.adnet.internal/JAD-Developers/azure-infra-automation-il4 --token <YOUR_RUNNER_TOKEN>

# Step 6: Start the runner
./run.sh
